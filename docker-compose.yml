services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sess_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sess
      POSTGRES_PASSWORD: sess
      POSTGRES_DB: sess
    ports:
      - "5434:5432"
    volumes:
      - sess_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sess -d sess"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: ./ai-service
    container_name: sess_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    environment:
      MODEL_PATH: /models/best.pt

volumes:
  sess_pgdata:
